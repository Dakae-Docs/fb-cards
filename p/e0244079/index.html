<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta property="og:image:secure_url" content="https://aebdel7amid-gif.github.io/fb-cards/p/e0244079/image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1122">
<meta property="og:image:height" content="1402">
<meta name="twitter:card" content="summary_large_image">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(160deg,#e8f0fe 0%,#f0f2f5 45%,#fdecec 100%);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;color:#1c1e21}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(24,60,140,.18);overflow:hidden;text-align:center;animation:u .4s ease}
.brand{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #eef0f3;text-align:start}
.brand img{width:48px;height:48px;border-radius:50%;border:2px solid #1877f2;background:#fff;flex:none}
.brand b{display:block;font-size:17px}
.brand small{color:#65676b}
.post{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#f0f2f5}
.body{padding:18px}
h1{font-size:19px;margin:0 0 6px;line-height:1.5}
p{margin:0 0 16px;color:#65676b}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:12px;text-decoration:none;font:inherit;font-weight:700;font-size:17px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.follow{background:#1877f2;color:#fff;box-shadow:0 4px 14px rgba(24,119,242,.4);animation:p 2s ease-in-out infinite}
.go{background:#e4e6eb;color:#1c1e21}
.done{background:#e7f6ec;color:#1a8d3e;animation:none;box-shadow:none}
small.c{color:#65676b}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
.ask.show{display:flex;animation:f .25s ease}
.box{width:100%;max-width:360px;background:#fff;border-radius:18px;padding:24px 18px;text-align:center;animation:u .3s ease}
.box img{width:72px;height:72px;border-radius:50%;border:3px solid #1877f2}
.box h2{font-size:21px;margin:10px 0 6px}
.box p{margin-bottom:16px}
.later{background:none;border:0;color:#65676b;font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.shot{position:relative;display:block;width:100%;padding:0 0 4px;border:0;background:#fff;cursor:zoom-in;font:inherit}
.shot .tap{display:block;margin:10px 14px 0;padding:10px 12px;border-radius:999px;background:#1877f2;color:#fff;font:inherit;font-size:15px;font-weight:700;animation:b 2.4s ease-in-out infinite}
.viewer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#000}
.viewer.show{display:flex;animation:f .2s ease}
.viewer .top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#111;color:#fff;flex:none}
.viewer .close{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:#333;color:#fff;font-size:20px;cursor:pointer}
.viewer .zh{flex:1;text-align:center;font-size:14px;font-weight:700}
.viewer .scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;display:flex;background:#000}
.viewer .scroll img{display:block;flex:none;margin:auto;max-width:none;max-height:none;cursor:zoom-in}
.viewer.z2 .scroll img{cursor:zoom-out}
.viewer .bar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff}
.viewer .bar .btn{margin:0}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes f{from{opacity:0}}
@keyframes u{from{transform:translateY(20px);opacity:0}}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="https://aebdel7amid-gif.github.io/fb-cards/assets/logos/dakae.png" alt="">
    <div><b>Dakae Docs</b><small>صفحتنا على فيسبوك</small></div>
  </div>
  <button class="shot" id="openShot" type="button" aria-label="عرض الصورة كاملة">
    <img class="post" src="https://aebdel7amid-gif.github.io/fb-cards/p/e0244079/image.jpg" alt="">
    <span class="tap">🔍 اضغط على الصورة للتكبير</span>
  </button>
  <div class="body">
    <h1>🎒 **التوجيه نحو الحياة المهنية ما يعنيش نهاية الدراسة!**</h1>
    
    <a class="btn follow js-follow" id="followBtn" href="https://www.facebook.com/profile.php?id=61594262661262" target="_blank" rel="noopener">👍 تابع صفحتنا على فيسبوك</a>
    
    
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="الصورة كاملة">
  <div class="top">
    <button class="close" id="closeShot" type="button" aria-label="إغلاق">✕</button>
    <span class="zh" id="zh">🔍 اضغط على الصورة للتكبير</span>
  </div>
  <div class="scroll" id="vScroll" dir="ltr"><img id="vImg" src="https://aebdel7amid-gif.github.io/fb-cards/p/e0244079/image.jpg" alt=""></div>
  <div class="bar">
    <a class="btn follow js-follow" id="vFollow" href="https://www.facebook.com/profile.php?id=61594262661262" target="_blank" rel="noopener">👍رجاءً لا تنسَ الضغط على «متابعة»</a>
  </div>
</div>

<div class="ask" id="ask" role="dialog" aria-modal="true">
  <div class="box">
    <img src="https://aebdel7amid-gif.github.io/fb-cards/assets/logos/dakae.png" alt="">
    <h2>رجاءً تابعنا 🙏</h2>
    <p>متابعتك لصفحة <b>Dakae Docs</b> تدعمنا كثيراً، وتصلك عروضنا وأخبارنا أولاً بأول.</p>
    <a class="btn follow js-follow" href="https://www.facebook.com/profile.php?id=61594262661262" target="_blank" rel="noopener">👍 نعم، سأتابع الصفحة</a>
    <button class="later" id="later">لاحقاً</button>
  </div>
</div>

<script>
(function(){
  var target="", page="https://www.facebook.com/profile.php?id=61594262661262", n=10, asked=false, followed=false, stopped=false, isVideo=false, t;
  var $=function(id){return document.getElementById(id);};
  var key='fbFollowed:'+page;
  try{ followed = localStorage.getItem(key)==='1'; }catch(e){}
  if(!page) followed=true;   // بدون صفحة متابعة

  function go(){ clearInterval(t); if(target) location.href=target; else if($('ask')) $('ask').classList.remove('show'); }
  function tick(){ n--; if(!followed && $('n')) $('n').textContent=n; if(n<=0) leave(); }
  function start(){ clearInterval(t); if(target && !stopped && !isVideo) t=setInterval(tick,1000); }
  function thanks(){
    var b=$('followBtn'); if(b) b.textContent='👍رجاءً لا تنسَ الضغط على «متابعة»';
    if($('count')) $('count').textContent='';
    if($('go')) $('go').textContent='الآن أكمل إلى الموقع ←';
  }
  // عند عدم الضغط على متابعة: نطلب مرة واحدة فقط، ثم نكمل
  function leave(){
    if(followed || asked){ go(); return; }
    asked=true; stopped=true; clearInterval(t);
    $('ask').classList.add('show');
  }

  if(target){
    if(followed && page && $('count')){ $('count').textContent='👍رجاءً لا تنسَ الضغط على «متابعة»'; n=Math.min(n,3); }
    start();
    $('go').addEventListener('click',function(e){ e.preventDefault(); leave(); });
  }
  if($('later')) $('later').addEventListener('click',go);

  // عرض الصورة كاملة: العدّاد يتوقف أثناء القراءة، ويكمل بعد الإغلاق
  function openShot(){ clearInterval(t); $('viewer').classList.add('show'); document.body.style.overflow='hidden'; setZ(0); }
  // ثلاث مراحل: كاملة ← بعرض الشاشة ← تكبير ×2 ← كاملة
  var zs=0, zhint=['🔍 اضغط على الصورة للتكبير','🔍 اضغط مرة أخرى لتكبير أكثر','🔍 اضغط لرؤية الصورة كاملة'];
  // المقاسات تُحسب حسب الشاشة: 0 = كاملة داخل الشاشة، 1 = ×2، 2 = ×4
  function setZ(v,fx,fy){
    zs=v; var im=$('vImg'), sc=$('vScroll');
    var nw=im.naturalWidth||1, nh=im.naturalHeight||1, cw=sc.clientWidth, ch=sc.clientHeight;
    var fit=Math.min(cw/nw, ch/nh), w=nw*fit*[1,2,4][zs];
    im.style.width=Math.round(w)+'px'; im.style.height=Math.round(w*nh/nw)+'px';
    $('viewer').classList.toggle('z2',zs===2);
    $('zh').textContent=zhint[zs];
    // التكبير حول النقطة التي ضغط عليها الزائر
    requestAnimationFrame(function(){
      if(zs===0){ sc.scrollLeft=0; sc.scrollTop=0; return; }
      sc.scrollLeft=(fx==null?0.5:fx)*im.offsetWidth-cw/2;
      sc.scrollTop=(fy==null?0:fy)*im.offsetHeight-ch/2;
    });
  }
  $('vImg').addEventListener('click',function(e){
    var r=this.getBoundingClientRect();
    setZ((zs+1)%3,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
  });
  $('vImg').addEventListener('load',function(){ if($('viewer').classList.contains('show')) setZ(zs); });
  window.addEventListener('resize',function(){ if($('viewer').classList.contains('show')) setZ(zs); });
  function closeShot(){ $('viewer').classList.remove('show'); document.body.style.overflow=''; if(n<3) n=3; start(); }
  if($('openShot')) $('openShot').addEventListener('click',openShot);

  // الفيديو: لا تحويل تلقائي أثناء المشاهدة، وبعد انتهائه نطلب المتابعة مرة واحدة
  if($('vid')){
    $('vid').addEventListener('play',function(){ stopped=true; clearInterval(t); });
    $('vid').addEventListener('ended',function(){
      if(!followed && !asked && $('ask')){ asked=true; $('ask').classList.add('show'); }
    });
  }
  $('closeShot').addEventListener('click',closeShot);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && $('viewer').classList.contains('show')) closeShot(); });

  Array.prototype.forEach.call(document.querySelectorAll('.js-follow'),function(a){
    a.addEventListener('click',function(){
      followed=true; stopped=true; clearInterval(t);
      try{ localStorage.setItem(key,'1'); }catch(e){}
      if($('ask')) $('ask').classList.remove('show');
      thanks();
    });
  });
})();
</script>
</body>
</html>
